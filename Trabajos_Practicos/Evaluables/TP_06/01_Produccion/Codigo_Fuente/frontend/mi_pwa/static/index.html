<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoHarmony Park</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1976d2" />
    <link rel="stylesheet" href="/static/css/styles.css" />
</head>

<body>
    <header>
        <img src="/static/icons/icono.jpg" alt="Logo EcoHarmony Park" class="logo-header">
        <h1>EcoHarmony</h1>
        <h2>Park</h2>
        <button id="btn-menu" class="hamburger-btn" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>
    <div id="menu-overlay" class="menu-overlay"></div>

    <!-- Menú lateral desplegable -->
    <nav id="side-menu" class="side-menu">
        <div class="side-menu-header">
            <h3>EcoHarmony Park</h3>
            <button id="btn-close-menu" class="close-btn" aria-label="Cerrar menú">&times;</button>
        </div>
        <ul class="menu-links">
            <li><a href="#" class="nav-link" data-view="inicio">Inicio</a></li>
            <li><a href="#" class="nav-link" data-view="actividades">Actividades</a></li>
            <li><a href="#" class="nav-link" data-view="entradas">Comprar Entradas</a></li>
            <li><a href="#" class="nav-link" data-view="mapa">Mapa del Parque</a></li>
        </ul>
    </nav>
    <main>
        <!-- PANTALLA 1: Inicio / Estado -->
        <section id="view-inicio" class="view active">
            <div class="card">
                <h2>Pantalla Principal</h2>
                <p>Bienvenido al sistema. Selecciona una opción del menú para continuar.</p>
                <button id="btn-fetch" class="btn-primary">Consultar Estado API</button>
                <pre id="api-output">Esperando...</pre>
            </div>
        </section>

        <!-- PANTALLA 2: Nueva Pantalla / Formulario -->
        <section id="view-gestion" class="view hidden">
            <div class="card">
                <h2>Nueva Pantalla (Formulario / Gestión)</h2>
                <p>Aquí colocamos la pantalla del caso de uso.</p>

                <form id="form-registro">
                    <div style="margin-bottom: 1rem;">
                        <label for="campo-nombre" style="display: block; margin-bottom: 0.3rem;">Nombre
                            completo:</label>
                        <input type="text" id="campo-nombre" required
                            style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;" />
                    </div>
                    <button type="submit" class="btn-primary">Guardar / Enviar</button>
                </form>

                <div id="form-resultado" style="margin-top: 1rem;"></div>
            </div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>

</html>
