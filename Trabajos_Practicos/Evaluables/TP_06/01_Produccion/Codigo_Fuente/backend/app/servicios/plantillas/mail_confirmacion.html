<!DOCTYPE html>
<html lang="es">
<body style="margin:0;padding:0;background:#f2e8cf;font-family:Lato,Arial,Helvetica,sans-serif;color:#22301f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2e8cf;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;">
        <tr><td style="background:#386641;padding:28px 32px;color:#ffffff;">
          <div style="font-size:13px;letter-spacing:2px;color:#a7c957;">ECOHARMONY PARK</div>
          <div style="font-size:26px;font-weight:bold;margin-top:6px;">¡Tu entrada está confirmada!</div>
        </td></tr>
        <tr><td style="padding:28px 32px 8px;">
          <p style="margin:0 0 6px;font-size:16px;">$resumen</p>
          <p style="margin:0;font-size:14px;color:#6a994e;">$pago</p>
        </td></tr>
        <tr><td align="center" style="padding:20px 32px;">
          <div style="border:2px dashed #a7c957;border-radius:14px;padding:20px;">
            <img src="cid:$qr_cid" width="200" height="200" alt="QR de tu entrada"
                 style="display:block;margin:0 auto;">
            <div style="margin-top:12px;font-size:12px;letter-spacing:1px;color:#6b7563;">CÓDIGO DE ENTRADA</div>
            <div style="font-size:22px;font-weight:bold;letter-spacing:3px;color:#386641;">
              $codigo_entrada</div>
            <div style="margin-top:6px;font-size:13px;color:#6b7563;">Mostralo al ingresar al parque.</div>
          </div>
        </td></tr>
        <tr><td style="padding:8px 32px 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;">
            <tr><td style="padding:8px 0;color:#6b7563;">Pase</td>
                <td align="right" style="padding:8px 0;">$pase</td></tr>
            <tr><td style="padding:8px 0;color:#6b7563;">Fecha de visita</td>
                <td align="right" style="padding:8px 0;">$fecha_visita</td></tr>
            $filas_visitantes
            <tr><td style="padding:12px 0;font-weight:bold;font-size:16px;">Total</td>
                <td align="right" style="padding:12px 0;font-weight:bold;font-size:16px;color:#386641;">
                  $total</td></tr>
          </table>
        </td></tr>
        <tr><td style="background:#f2e8cf;padding:18px 32px;font-size:12px;color:#6b7563;text-align:center;">
          Abierto de 8:30 a 19 · Cerrado los lunes, el 25/12 y el 1/1
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
